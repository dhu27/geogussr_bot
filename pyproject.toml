[project]
name = "geoguessr-rl"
version = "0.1.0"
description = "An agent that plays a local GeoGuessr-style game from Mapillary panoramas."
readme = "PLAN.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pillow>=10.3",
    "pyyaml>=6",
    "requests>=2.32",
    "flask>=3.0",
    "playwright>=1.48",
]

[project.optional-dependencies]
# The real encoder. Not needed for fixtures, tests, or CI (they use FakeEncoder).
ml = [
    "torch>=2.4",
    "transformers>=4.45",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "data", "env", "models", "game", "harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]  # don't rewrite code blocks in PLAN.md

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Playwright Chromium (run `uv run playwright install chromium`)"]
