# models/guesser/: geocells, classifier, multi-view combining, expected-score guess.
n_cells: 8             # used by run_e2e on the fixtures; scripts/train_guesser.py sweeps its own
kmeans_iters: 50
seed: 0

# Softmax head (CellGuesser). scripts/train_guesser.py picks n_cells and l2 on the val split.
l2: 0.001
epochs: 300
lr: 0.01
sweep:
  n_cells: [8, 16, 24, 32, 64, 128, 256]   # 64+ added for world_v1 (312 regions vs the pilot's 45)
  l2: [0.0001, 0.001, 0.01]

temperature: 20.0      # NearestMeanGuesser baseline only (the M0 placeholder)

# Model every evaluation is compared with (paired, scripts/evaluate.py). Pull it first:
#   uv run python scripts/data_hub.py pull-model softmax_k256
baseline_model: softmax_k256
