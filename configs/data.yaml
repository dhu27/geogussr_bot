# data/: Mapillary sampling, download, filtering, splits.
data_root: datasets            # gitignored; override with GEO_DATA_ROOT (e.g. the shared drive)
image_width: 1024              # Mapillary thumb size to store (thumb_1024_url)
min_quality_score: 0.0         # placeholder; tune at M1
max_images_per_sequence: 20

splits:                        # fractions of *regions*; creators are kept on one side (data/splits.py)
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 0

# tests/fixtures/: ~50 real panoramas, 2 per region, built by scripts/make_fixtures.py.
