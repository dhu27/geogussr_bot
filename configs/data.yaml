# Real downloader (scripts/download.py --source mapillary). A region is a block of
# (2*tile_radius+1)^2 zoom-14 coverage tiles around its centre (radius 1 -> 3x3 tiles, roughly
# 4-7 km across). Images are sampled from inside the block, at most max_images_per_sequence per
# capture sequence (top of this file), up to images_per_region per region.
pilot:
  images_per_region: 100
  tile_zoom: 14                # Mapillary serves its image layer at zoom 14 only
  tile_radius: 1
  min_images_per_region: 30    # a region below this is kept but flagged in the run summary
  workers: 4                   # parallel image lookups/downloads; keep modest (API rate limits)
  regions:                     # ~50, one per country where possible (PLAN.md 7.1)
