# data/: Mapillary sampling, download, filtering, splits.
data_root: datasets            # gitignored; override with GEO_DATA_ROOT
hub_repo: ResearchGeogussr/geoguessr-rl-data   # private HF dataset repo; see docs/DATA.md
image_width: 1024              # Mapillary thumb size to store (thumb_1024_url)
min_quality_score: 0.5         # drop images scoring below this; images with no score pass. TUNE after
                               # looking at the score summary the pilot run prints (see docs/DATA.md)
max_images_per_sequence: 20

splits:                        # fractions of *regions*; creators are kept on one side (data/splits.py)
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 0

